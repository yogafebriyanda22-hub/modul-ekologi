<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul Interaktif Ekologi dan Keanekaragaman Hayati</title>
    <!-- Kamu bisa menyisipkan link CSS atau Font eksternal di sini jika ada -->
    <style>
        /* SINKRONISASI STYLE DASAR MODUL KREASIMU */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f9f4;
            margin: 0;
            padding: 0;
        }
        /* Tambahkan style kustom navigasi, halaman topik, dll. sesuai kebutuhan modulmu di sini */
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- BAGIAN KONTEN / HALAMAN MODUL UTAMA        -->
    <!-- ========================================== -->
    <!-- (Silakan lengkapi bagian struktur HTML halaman materi Topik 1-3, Eksplorasi Anda di sini) -->


    <!-- ========================================== -->
    <!-- BAGIAN HALAMAN MENU MENU 6: EVALUASI KUIS  -->
    <!-- ========================================== -->
    <div id="halamanEvaluasi" style="padding: 20px; max-width: 800px; margin: auto;">
        <h2>Evaluasi Akhir Belajar</h2>
        <div style="margin-bottom: 15px;">
            <label>Nama Siswa:</label><br>
            <input type="text" id="nameInput" placeholder="Masukkan nama lengkapmu..." style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc;">
        </div>
        <div style="margin-bottom: 20px;">
            <label>Kelas:</label><br>
            <input type="text" id="classInput" placeholder="Contoh: 7A..." style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc;">
        </div>

        <!-- Contoh Struktur Soal Kuis (Sesuaikan dengan soal asli kreasimu) -->
        <div id="areaSoalKuis">
            <!-- Soal-soal kuis pilihan ganda diletakkan di area ini -->
        </div>

        <button onclick="cekNilaiKuis()" style="background-color: #007bff; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;">
            🚀 Kirim & Cek Nilai Akhir
        </button>
    </div>

    <!-- ======================================================= -->
    <!-- BAGIAN PANEL HASIL & AREA REFLEKSI (MUNCUL OTOMATIS)    -->
    <!-- ======================================================= -->
    <div id="panelHasil" style="display: none; padding: 20px; max-width: 800px; margin: 20px auto; background-color: #e8f5e9; border: 2px solid #a5d6a7; border-radius: 10px; text-align: center;">
        <h3 style="color: #2e7d32;">🎉 Hasil Ujian Berhasil Diperoleh 🎉</h3>
        <p>Nama: <span id="outName" style="font-weight: bold;"></span> | Kelas: <span id="outClass" style="font-weight: bold;"></span></p>
        
        <h1 id="scoreText" style="font-size: 48px; color: #1b5e20; margin: 15px 0;">0 / 100</h1>
        <p id="motivationalText" style="font-style: italic; color: #555;"></p>

        <!-- Kotak Refleksi dan Tombol Kirim akan Dibuat Secara Otomatis di Sini oleh JavaScript -->
    </div>


    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIKA KUIS & PENGIRIMAN DATA   -->
    <!-- ========================================== -->
    <script>
        // --- 1. DEKLARASI VARIABEL UTAMA (GLOBAL) ---
        let totalSkor = 0;
        let correctAnswers = 0; // Jalankan fungsi hitung jawaban benarmu di sini
        let totalSoal = 10;     // Sesuaikan dengan total jumlah soal kuis interaktifmu
        let emojiTerpilihGlobal = "Belum memilih emoji"; //

        // --- 2. FUNGSI HITUNG & CEK NILAI KUIS ---
        function cekNilaiKuis() {
            const nama = document.getElementById('nameInput').value.trim();
            const kelas = document.getElementById('classInput').value.trim();

            if (!nama || !kelas) {
                alert("Silakan isi Nama dan Kelas terlebih dahulu sebelum mengecek nilai!");
                return;
            }

            // [CONTOH LOGIKA HITUNG SKOR] - Sesuaikan dengan fungsi deteksi jawaban kuis aslimu
            // Misalkan variabel correctAnswers dihitung dari jumlah radio button yang benar
            correctAnswers = 3; // Contoh simulasi dapat benar 3 soal
            totalSkor = (correctAnswers / totalSoal) * 100; //

            // Tampilkan identitas siswa ke dalam panel hasil kuis bawah
            document.getElementById('outName').innerText = nama; //
            document.getElementById('outClass').innerText = kelas; //
            document.getElementById('scoreText').innerText = totalSkor + " / 100"; //

            // Tampilkan pesan teks motivasi yang adaptif sesuai nilai capaian siswa
            let motivasi = ""; //
            if (totalSkor >= 80) { //
                motivasi = "Luar biasa! Kamu memahami seluruh konsep materi dengan sempurna! Pertahankan prestasimu ya! 🌟"; //
            } else if (totalSkor >= 60) { //
                motivasi = "Bagus! Kamu sudah menguasai materi ini dengan cukup baik. Sukses selalu! 👍"; //
            } else { //
                motivasi = "Jangan berkecil hati ya. Ayo ulas kembali lembar modul dan coba kerjakan kuisnya lagi! 📚"; //
            } //
            document.getElementById('motivationalText').innerText = motivasi; //

            // Buka dan tampilkan panel kotak hasil ujian
            const panelHasil = document.getElementById('panelHasil');
            panelHasil.style.display = 'block';

            // --- 3. PEMBUATAN AREA REFLEKSI & TOMBOL KIRIM DATA SECARA DINAMIS ---
            if (!document.getElementById('textRefleksi')) { //
                const kotakKomentar = document.createElement('div'); //
                kotakKomentar.innerHTML = `
                    <div style="margin-top: 25px; text-align: center; font-family: sans-serif; border-top: 1px dashed #ccc; padding-top: 20px;">
                        <label for="textRefleksi" style="display: block; margin-bottom: 10px; font-weight: bold; color: #333;">
                            Tuliskan kalimat refleksimu atau kendala belajar di sini:
                        </label>
                        <textarea id="textRefleksi" rows="4" style="width: 85%; max-width: 500px; padding: 12px; border-radius: 8px; border: 2px solid #bce2ca; outline: none; font-size: 14px;" placeholder="Ceritakan apa yang kamu rasakan setelah petualangan belajar ini..."></textarea>
                        <br>
                        <button id="btnKirimData" style="margin-top: 15px; background-color: #28a745; color: white; border: none; padding: 10px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s;">
                             Kirim Hasil Nilai & Komentar Refleksi
                        </button>
                    </div>
                `; //
                
                // Masukkan elemen ke HTML halaman terlebih dahulu agar bisa dibaca browser
                panelHasil.appendChild(kotakKomentar); 

                // Daftarkan fungsi klik kirim spreadsheet terpadu pada tombol baru tersebut
                document.getElementById('btnKirimData').addEventListener('click', function() { //
                    
                    // Kumpulkan objek paket data kuis secara real-time langsung dari layar input
                    const dataKuis = { //
                        nama: document.getElementById('nameInput') ? document.getElementById('nameInput').value : "Anonim", //
                        kelas: document.getElementById('classInput') ? document.getElementById('classInput').value : "-", //
                        nilai: typeof totalSkor !== 'undefined' ? totalSkor : 0, //
                        emoji: typeof emojiTerpilihGlobal !== 'undefined' ? emojiTerpilihGlobal : "Belum memilih emoji", //
                        komentar_refleksi: document.getElementById('textRefleksi') ? document.getElementById('textRefleksi').value : "Tidak menulis refleksi" //
                    }; //

                    // Link Web App URL Jembatan Google Apps Script milikmu
                    const urlJembatan = "https://script.google.com/macros/s/AKfycbyQ_aIWZgnVj7fkLZ1yHLx82ZFGuZgNpqHFfBPcVNqJn4uD0gFBVTppp5o4c8SItmekwQ/exec"; //

                    // Visual status loading pengiriman data
                    document.getElementById('btnKirimData').innerText = "Sedang Mengirim..."; //
                    document.getElementById('btnKirimData').disabled = true; //

                    // Eksekusi pengiriman data menuju Google Sheets
                    fetch(urlJembatan, { //
                        method: "POST", //
                        body: JSON.stringify(dataKuis) //
                    }) //
                    .then(response => response.json()) //
                    .then(result => { //
                        if(result.status === "success") { //
                            alert("Terima kasih! Data nilai, emoji, dan kalimat refleksimu BERHASIL disimpan ke Google Sheets Guru!"); //
                            document.getElementById('btnKirimData').innerText = "✅ Data Berhasil Terkirim!"; //
                            document.getElementById('btnKirimData').style.backgroundColor = "#6c757d"; //
                        } //
                    }) //
                    .catch(error => { //
                        console.error("Error:", error); //
                        alert("Gagal mengirim data, silakan klik kirim ulang."); //
                        document.getElementById('btnKirimData').innerText = "Kirim Hasil Nilai & Komentar Refleksi"; //
                        document.getElementById('btnKirimData').disabled = false; //
                    }); //
                }); //
            }

            // Otomatis gulir layar fokus mengarah ke panel hasil evaluasi bawah
            document.getElementById('panelHasil').scrollIntoView({ behavior: 'smooth' });
        }

        // --- 4. FUNGSI PEMILIHAN EMOJI REFLEKSI ---
        function addFeedback(emojiType) { //
            // Memperbarui angka indikator badge di bawah emoji pada halaman kreasimu
            const badge = document.getElementById(`fb-${emojiType}`); //
            if (badge) {
                let currentCount = parseInt(badge.innerText) || 0; //
                badge.innerText = currentCount + 1; //
            }

            // REKAM JENIS EMOJI YANG DIKLIK SISWA KE VARIABEL GLOBAL AGAR BISA TERKIRIM
            emojiTerpilihGlobal = emojiType; //

            // Berikan konfirmasi interaktif kepada siswa
            alert(`Terima kasih! Refleksi perasaan [${emojiType.toUpperCase()}] kamu berhasil terekam.`); //
        } //
    </script>
</body>
</html>
